# Read-only "dumb HTTP" git hosting of /srv/git/*.git (bare repos kept fresh by
# their post-update hook running `git update-server-info`). Reached as
# https://<host>/git/<repo>.git — Caddy proxies /git/* here unauthenticated.
server {
    listen 80;
    server_name _;
    location /git/ {
        alias /srv/git/;
        autoindex on;
        autoindex_exact_size off;
        default_type application/octet-stream;
    }
    location / { return 404; }
}
