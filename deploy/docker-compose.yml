# DeepSeek Harness — a self-contained stack that comes up on any Linux box
# with Docker. `deploy/bootstrap.sh` writes .env and starts it.
#
#   dsh               — the harness, on 127.0.0.1:3080 of the host
#   caddy             — profile `proxy`: TLS for your domain plus a password
#                       gate in front of dsh (bootstrap.sh writes its Caddyfile)
#   dsh-git           — profile `git`: read-only git mirror of this fork at /git/
#   dsh-imggw-bridge  — profile `imggw`: unix-socket bridge to a host-local image
#                       gateway, for `generate_image`
#
# Profiles are switched on by COMPOSE_PROFILES in .env. Anything that belongs to
# ONE machine — an external network, a reverse proxy that already exists —
# goes in an override file named by COMPOSE_FILE in .env, never in this one;
# docker-compose.jusl.yml is the machine this fork grew up on.
#
# Host access (the machine's disk and a command gateway) is never switched on
# here. It is a separate, deliberate step: deploy/host-access.sh on.
services:
  dsh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.5-rc.3}
        FORK_VERSION: ${FORK_VERSION:-local}
        FORK_COMMIT: ${FORK_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # tagged with OUR fork version (see VERSION / deploy/release.sh), not upstream's
    image: deepseek-harness:${FORK_VERSION:-local}
    container_name: dsh
    restart: unless-stopped
    # The image runs as `node` (uid 1000). Host access flips this to root:
    # the interesting directories on a host — /root above all — are 0700, so a
    # uid-1000 harness sees the mount and cannot open a single project in it.
    # `deploy/host-access.sh off` puts it back and returns ownership of the
    # data directories to uid 1000.
    user: ${DSH_CONTAINER_USER:-node}
    environment:
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:?set in .env}
      TZ: ${TZ:-UTC}
      # bearer for the image gateway; read by dsh-ext-image-gen through the
      # credential layer (launch environment wins)
      DSH_IMAGE_GATEWAY_TOKEN: ${DSH_IMAGE_GATEWAY_TOKEN:-}
      DSH_IMAGE_GATEWAY_SOCKET: /run/imggw/gateway.sock
      # Model credentials. The launch environment is the first credential layer
      # the harness consults, so a key set here works without the Settings UI —
      # which a reverse-proxied page cannot offer (see deploy/README.md).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Telegram broadcast (deploy/telegram.sh wires these)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # $DSH_HOME (settings, .credentials.yaml with API keys, sessions, profiles)
      - ${DSH_DATA_DIR:-/root/dsh-data}/data:/data
      # the agent's workspace root (what it can read/edit)
      - ${DSH_DATA_DIR:-/root/dsh-data}/workspace:/workspace
      # unix socket published by dsh-imggw-bridge
      - ${DSH_DATA_DIR:-/root/dsh-data}/run:/run/imggw
      # ── host access (dsh-ext-host) ──────────────────────────────────────
      # The host's disk, so read/edit/grep work on the machine itself. The
      # DEFAULT points at an empty directory: host access is opt-in, and
      # `deploy/host-access.sh on` is what repoints it at `/`.
      - ${DSH_HOST_ROOT:-${DSH_DATA_DIR:-/root/dsh-data}/no-host}:/host:rw
      # Socket of the host command gateway (deploy/hostd). Absent until that
      # service is installed, which is the same switch.
      - ${DSH_DATA_DIR:-/root/dsh-data}/run-host:/run/dsh-host
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      - dsh-net
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    mem_limit: ${DSH_MEM_LIMIT:-2g}

  caddy:
    image: caddy:2-alpine
    container_name: dsh-caddy
    profiles: [proxy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./standalone/Caddyfile:/etc/caddy/Caddyfile:ro
      # certificates and ACME account: keep them, or every restart re-issues
      - ${DSH_DATA_DIR:-/root/dsh-data}/caddy/data:/data
      - ${DSH_DATA_DIR:-/root/dsh-data}/caddy/config:/config
    depends_on:
      - dsh
    networks:
      - dsh-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  dsh-git:
    image: nginx:alpine
    container_name: dsh-git
    profiles: [git]
    restart: unless-stopped
    volumes:
      - ${DSH_GIT_DIR:-/srv/git}:/srv/git:ro
      - ./git-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dsh-net
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

  # Host-network socat: exposes a loopback-only image gateway as a unix socket
  # in a shared directory. No TCP port is opened, so the firewall is untouched.
  dsh-imggw-bridge:
    image: alpine/socat
    container_name: dsh-imggw-bridge
    profiles: [imggw]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DSH_DATA_DIR:-/root/dsh-data}/run:/run/imggw
    command: >-
      UNIX-LISTEN:/run/imggw/gateway.sock,fork,reuseaddr,unlink-early,mode=666
      TCP:127.0.0.1:${DSH_IMAGE_GATEWAY_HOST_PORT:-8792}
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "1" }

networks:
  dsh-net:
    name: ${DSH_NETWORK_NAME:-dsh-net}
