# DeepSeek Harness behind the box's shared Caddy (network `aisignals-edge`).
#   dsh      — the harness Web UI, reached by Caddy as dsh:3080
#   dsh-git  — public read-only git mirror of this fork, Caddy proxies /git/*
# Host-specific values live in .env (see .env.example).
services:
  dsh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.5-rc.2}
    image: deepseek-harness:${DSH_VERSION:-0.1.5-rc.2}
    container_name: dsh
    restart: unless-stopped
    environment:
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:?set in .env}
      TZ: ${TZ:-UTC}
    volumes:
      # $DSH_HOME (settings, .credentials.yaml with API keys, sessions, profiles)
      - ${DSH_DATA_DIR:-/root/dsh-data}/data:/data
      # the agent's workspace root (what it can read/edit)
      - ${DSH_DATA_DIR:-/root/dsh-data}/workspace:/workspace
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      - aisignals-edge
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    mem_limit: ${DSH_MEM_LIMIT:-2g}

  dsh-git:
    image: nginx:alpine
    container_name: dsh-git
    restart: unless-stopped
    volumes:
      - ${DSH_GIT_DIR:-/srv/git}:/srv/git:ro
      - ./git-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - aisignals-edge
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }

networks:
  aisignals-edge:
    external: true
